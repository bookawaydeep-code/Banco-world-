<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SoundifiedLoader — Preview</title>
<style>
  /* ===== stand-ins for the @/assets that aren't in this repo ===== */
  :root{
    --green:#3dffa0; --green-deep:#22e07a;
    --cyan:#00d4ff; --indigo:#818cf8; --purple:#9333ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#040407;overflow:hidden;font-family:system-ui,sans-serif}

  .root{position:fixed;inset:0;z-index:9999;overflow:hidden;background:#040407}
  .root.out{animation:sl-fade-out .72s ease forwards}

  /* graffiti wall stand-in: layered neon gradients instead of the png */
  .wall{
    position:absolute;inset:0;opacity:.55;animation:sl-wall-in 1.2s ease forwards;
    background:
      radial-gradient(circle at 18% 30%, rgba(147,51,234,.5), transparent 38%),
      radial-gradient(circle at 82% 22%, rgba(0,212,255,.45), transparent 40%),
      radial-gradient(circle at 70% 78%, rgba(129,140,248,.5), transparent 42%),
      radial-gradient(circle at 30% 80%, rgba(61,255,160,.35), transparent 40%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 12px, transparent 12px 24px),
      #0b0b14;
  }
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%, rgba(10,12,24,.25) 0%, rgba(4,4,8,.78) 60%, rgba(2,2,4,.96) 100%)}

  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}

  .wm-wrap{position:relative;display:flex;align-items:center;justify-content:center}
  /* splatter stand-in */
  .splatter{
    position:absolute;width:min(680px,92vw);height:280px;pointer-events:none;
    mix-blend-mode:screen;opacity:.8;animation:sl-splat-in 1s cubic-bezier(.2,.8,.2,1) forwards;
    background:
      radial-gradient(circle at 30% 50%, rgba(0,212,255,.55), transparent 22%),
      radial-gradient(circle at 55% 35%, rgba(147,51,234,.55), transparent 20%),
      radial-gradient(circle at 70% 60%, rgba(129,140,248,.55), transparent 24%),
      radial-gradient(circle at 45% 70%, rgba(61,255,160,.5), transparent 18%);
    filter:saturate(1.2) blur(2px);
  }
  h1{
    position:relative;margin:0;
    font-family:'Bangers','Arial Black',system-ui,sans-serif;
    font-size:clamp(48px,11vw,132px);line-height:.9;letter-spacing:.04em;font-weight:800;
    transform:skewX(-4deg);
    background:linear-gradient(180deg,#d9f6ff 0%,var(--cyan) 32%,var(--indigo) 64%,var(--purple) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 6px rgba(0,212,255,.85)) drop-shadow(0 0 22px rgba(129,140,248,.6)) drop-shadow(0 0 40px rgba(147,51,234,.5));
    animation:sl-word-in .9s cubic-bezier(.2,.8,.2,1) both, sl-flicker 3.4s ease-in-out 1s infinite;
    user-select:none;
  }
  .tagline{font-family:'Permanent Marker',cursive;color:rgba(180,200,255,.7);font-size:clamp(12px,2.4vw,18px);letter-spacing:.18em;margin-top:10px;text-transform:uppercase}

  .zone{width:min(420px,80vw);margin-top:44px}
  .mono{font-family:'Space Mono',ui-monospace,monospace}
  .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .step{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(180,200,255,.75)}
  .pct{font-size:14px;font-weight:700;color:var(--cyan)}
  .track{position:relative;height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
  .fill{position:absolute;inset:0;width:0;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--indigo) 55%,var(--purple));box-shadow:0 0 12px rgba(0,212,255,.7);transition:width .2s linear}

  /* reveal badge */
  .badge-col{display:flex;flex-direction:column;align-items:center;gap:14px}
  .badge-box{position:relative;width:76px;height:76px;animation:sl-badge-pop .5s cubic-bezier(.2,.8,.2,1) both}
  .ring{position:absolute;inset:0;border-radius:999px;border:2px solid var(--green-deep);animation:sl-ring .8s ease-out .25s forwards}
  .disc{position:absolute;inset:0;border-radius:999px;overflow:hidden;
    background:radial-gradient(circle at 50% 40%, rgba(34,224,122,.22), rgba(8,20,14,.6));
    border:2px solid rgba(34,224,122,.55);box-shadow:0 0 24px rgba(34,224,122,.45), inset 0 0 16px rgba(34,224,122,.25)}
  .disc svg{position:absolute;inset:0}
  .check{fill:none;stroke:var(--green);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 0 6px rgba(61,255,160,.9));stroke-dasharray:60;stroke-dashoffset:60;
    animation:sl-check .5s ease .3s forwards, sl-check-rip .4s ease 1s forwards}
  .rip{fill:none;stroke:#eafff1;stroke-width:2.5;stroke-linecap:round;opacity:0;transform-origin:center;animation:sl-rip-flash .5s ease 1s forwards}
  .sweep{position:absolute;top:-10%;left:-15%;width:10%;height:120%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);filter:blur(1px);transform:skewX(-18deg);animation:sl-sweep .7s cubic-bezier(.4,0,.2,1) forwards}

  .note-push{position:absolute;inset:0;display:grid;place-items:center;animation:sl-note-push .8s cubic-bezier(.5,0,.7,1) 1.55s forwards}
  .note-push svg{opacity:0;filter:drop-shadow(0 0 8px rgba(61,255,160,.9));animation:sl-note-form .5s cubic-bezier(.2,1.4,.4,1) 1.1s forwards}

  .wave{position:absolute;top:0;bottom:0;left:-46px;width:44px;display:flex;align-items:center;justify-content:center;gap:3px;opacity:0;animation:sl-wave-push .8s ease-out 1.5s forwards}
  .wave span{display:block;width:3px;border-radius:3px;background:linear-gradient(#7dffc0,var(--green-deep));box-shadow:0 0 8px rgba(61,255,160,.8);animation:sl-eq .5s ease-in-out infinite}

  .ready{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--green)}

  @keyframes sl-fade-out{to{opacity:0;transform:scale(1.04);pointer-events:none}}
  @keyframes sl-wall-in{from{opacity:0;transform:scale(1.12)}to{opacity:.55;transform:scale(1.04)}}
  @keyframes sl-splat-in{0%{opacity:0;transform:scale(.6) rotate(-6deg)}60%{opacity:.9}100%{opacity:.8;transform:scale(1) rotate(0)}}
  @keyframes sl-word-in{0%{opacity:0;transform:translateY(26px) scale(.92) skewX(-6deg);filter:blur(8px)}100%{opacity:1;transform:translateY(0) scale(1) skewX(-4deg);filter:blur(0)}}
  @keyframes sl-flicker{0%,100%{opacity:1}92%{opacity:1}94%{opacity:.55}96%{opacity:1}97%{opacity:.7}98%{opacity:1}}
  @keyframes sl-sweep{0%{left:-15%;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:115%;opacity:0}}
  @keyframes sl-check{to{stroke-dashoffset:0}}
  @keyframes sl-badge-pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes sl-ring{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.7);opacity:0}}
  @keyframes sl-check-rip{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(-7px) scale(1.12)}}
  @keyframes sl-rip-flash{0%{opacity:0;transform:scaleY(.3)}45%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1.4)}}
  @keyframes sl-note-form{0%{opacity:0;transform:scale(.15) rotate(-30deg)}70%{opacity:1;transform:scale(1.15) rotate(0)}100%{opacity:1;transform:scale(1) rotate(0)}}
  @keyframes sl-note-push{0%{transform:translateX(0) rotate(0);opacity:1}55%{transform:translateX(80px) rotate(14deg);opacity:1}100%{transform:translateX(190px) rotate(24deg);opacity:0}}
  @keyframes sl-wave-push{0%{transform:translateX(-80px) scaleX(.5);opacity:0}30%{opacity:1}60%{transform:translateX(4px) scaleX(1);opacity:1}100%{transform:translateX(120px) scaleX(1);opacity:0}}
  @keyframes sl-eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
</style>
</head>
<body>
  <div class="root" id="root">
    <div class="wall"></div>
    <div class="vignette"></div>
    <div class="center">
      <div class="wm-wrap">
        <div class="splatter"></div>
        <h1>SOUNDIFIED</h1>
      </div>
      <div class="tagline">One Studio · Every Tool</div>

      <div class="zone" id="zone">
        <!-- loading phase -->
        <div id="loading">
          <div class="row">
            <span class="step mono" id="step">Booting audio engine</span>
            <span class="pct mono" id="pct">0%</span>
          </div>
          <div class="track"><div class="fill" id="fill"></div></div>
        </div>
      </div>
    </div>
  </div>

<script>
  const STEPS = ["Booting audio engine","Loading DSP modules","Warming up the meters","Mixing the colors","Spraying the walls","Soundcheck"];
  const fill = document.getElementById('fill'), pct = document.getElementById('pct'), step = document.getElementById('step');
  const zone = document.getElementById('zone'), root = document.getElementById('root');
  const LOAD = 3400;

  const badgeHTML = `
    <div class="badge-col">
      <div class="badge-box">
        <div class="ring"></div>
        <div class="disc">
          <svg viewBox="0 0 76 76" width="76" height="76">
            <path class="check" d="M22 39 L33 50 L55 27"/>
            <path class="rip" d="M40 16 L46 30 L36 38 L48 48 L38 60"/>
          </svg>
          <div class="sweep"></div>
        </div>
        <div class="note-push">
          <svg viewBox="0 0 40 40" width="40" height="40">
            <g fill="#3dffa0">
              <rect x="22" y="6" width="3" height="20" rx="1.5"/>
              <path d="M25 6 C25 6 35 7.5 35 14 C35 16.5 31.5 17.5 30 15.5 C33 15.5 33 12 25 11 Z"/>
              <ellipse cx="17" cy="27" rx="6.5" ry="4.6" transform="rotate(-18 17 27)"/>
            </g>
          </svg>
        </div>
        <div class="wave">
          <span style="height:10px;animation-delay:0s"></span>
          <span style="height:22px;animation-delay:.08s"></span>
          <span style="height:34px;animation-delay:.16s"></span>
          <span style="height:22px;animation-delay:.08s"></span>
          <span style="height:10px;animation-delay:0s"></span>
        </div>
      </div>
      <span class="ready">Ready</span>
    </div>`;

  const start = performance.now();
  function tick(now){
    const t = Math.min(1,(now-start)/LOAD);
    const eased = 1 - Math.pow(1-t,2.2);
    fill.style.width = Math.round(eased*100)+'%';
    pct.textContent = Math.round(eased*100)+'%';
    step.textContent = STEPS[Math.min(STEPS.length-1, Math.floor(eased*STEPS.length))];
    if(t<1){ requestAnimationFrame(tick); }
    else { verify(); }
  }
  const noLoop = location.search.includes('noloop');
  function verify(){
    zone.innerHTML = badgeHTML;           // checkmark -> rip -> note -> wave
    if(noLoop) return;
    setTimeout(()=> root.classList.add('out'), 2200);   // fade
    setTimeout(()=> { root.classList.remove('out'); restart(); }, 4200); // loop for preview
  }
  function restart(){
    zone.innerHTML = `<div id="loading"><div class="row"><span class="step mono" id="step">Booting audio engine</span><span class="pct mono" id="pct">0%</span></div><div class="track"><div class="fill" id="fill"></div></div></div>`;
    location.reload();
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
